name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - run: pyrverse-parity --output reports/latest
      - name: Save numerical comparison reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-python-${{ matrix.python-version }}
          path: reports/latest/
          if-no-files-found: error
          retention-days: 14
